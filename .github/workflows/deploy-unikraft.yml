name: Deploy to Unikraft

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Unikraft CLI
        uses: unikraft/setup-action@v1

      - name: Login to Unikraft Cloud
        run: printf '%s' "${{ secrets.UNIKRAFT_TOKEN }}" | unikraft login --token -

      - name: Run instance
        run: unikraft run --metro sin --publish 443:8080/http+tls --publish 80:443/http+redirect -m 4096M --image "${{ secrets.UNIKRAFT_ORG }}/new-api:latest" -e PORT=8080 -e TZ=Asia/Shanghai -e SESSION_SECRET="${{ secrets.NEW_API_SESSION_SECRET }}"
